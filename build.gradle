plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // 官方 maven.neoforged.net 国内不可达，用 CDN 镜像；本地仓库兜底
    maven { url = uri('https://neoforged.forgecdn.net/releases') }
    maven { url = uri("file:///${rootDir}/tools/local-maven") }
    maven { url = uri('https://bmclapi2.bangbang93.com/maven') }
    mavenCentral()
}

dependencies {
    // 纯 Java 的 OGG Vorbis 解码器（Java Sound SPI，播放 config 里导入的音乐）
    implementation 'com.github.trilarion:vorbis-support:1.0.0'
}

// 把 vorbis-support（含 META-INF/services 的 SPI 注册）合并进发布 jar，
// 否则正式环境里没有开发依赖会加载失败。
tasks.named('jar') {
    from({
        configurations.runtimeClasspath
                .findAll { it.name.startsWith('vorbis-support') }
                .collect { zipTree(it) }
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
